<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none';"
    />
    <title>AngelOne Desk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot" id="status-dot"></span>
        <strong>AngelOne Desk</strong>
        <span class="muted" id="status-text">starting…</span>
      </div>
      <div class="topstats">
        <div class="stat"><label>Client</label><span id="stat-client">—</span></div>
        <div class="stat"><label>Available</label><span id="stat-funds">—</span></div>
        <div class="stat"><label>Day P&amp;L</label><span id="stat-pnl">—</span></div>
        <div class="stat"><label>Feed</label><span id="stat-feed">—</span></div>
        <div class="stat"><label>Clock</label><span id="stat-clock">—</span></div>
      </div>
      <button id="btn-refresh" class="ghost">Refresh</button>
    </header>

    <main class="grid">
      <!-- ---------------- watchlist ---------------- -->
      <aside class="panel watchlist">
        <div class="panel-head"><h2>Watchlist</h2></div>
        <div class="add-row">
          <select id="wl-exch" title="Exchange">
            <option value="NSE">NSE</option>
            <option value="MCX">MCX</option>
            <option value="NFO">NFO</option>
            <option value="BSE">BSE</option>
            <option value="CDS">CDS</option>
          </select>
          <input id="wl-input" placeholder="Add symbol" autocomplete="off" />
          <button id="wl-add" class="primary sm">Add</button>
        </div>
        <div id="wl-suggest" class="suggest hidden"></div>
        <ul id="wl-list" class="wl-list"></ul>
      </aside>

      <!-- ---------------- chart ---------------- -->
      <section class="panel chart-col">
        <div class="tv-toolbar">
          <button id="tv-symbol" class="tv-btn strong">—</button>
          <span class="tv-sep"></span>
          <div class="tv-intervals" id="tv-intervals"></div>
          <span class="tv-sep"></span>
          <select id="tv-type" class="tv-select"></select>
          <button id="tv-indicators" class="tv-btn">Indicators</button>
          <span class="tv-sep"></span>
          <button id="tv-log" class="tv-btn" title="Logarithmic price scale">Log</button>
          <button id="tv-fit" class="tv-btn" title="Fit all bars">Fit</button>
          <span class="tv-spacer"></span>
          <span class="muted" id="chart-session"></span>
          <div id="tv-ind-panel" class="ind-panel hidden"></div>
        </div>

        <div class="tv-body">
          <div class="tv-rail" id="tv-rail"></div>
          <div class="tv-panes">
            <div class="tv-pane" id="price-pane">
              <div id="chart" class="chart"></div>
              <div class="tv-legend" id="tv-legend"></div>
            </div>
            <div class="osc-head"><select id="tv-osc" class="tv-select"></select></div>
            <div id="osc-chart" class="chart osc"></div>
          </div>
        </div>
        <div class="levels" id="levels"></div>
      </section>

      <!-- ---------------- right column ---------------- -->
      <aside class="panel right-col">
        <div class="tabs">
          <button class="tab active" data-tab="order">Order</button>
          <button class="tab" data-tab="positions">Positions</button>
          <button class="tab" data-tab="holdings">Holdings</button>
          <button class="tab" data-tab="orders">Book</button>
        </div>

        <div class="tab-body" id="tab-order">
          <form id="order-form" class="form">
            <div class="row2">
              <label
                >Exchange
                <select id="o-exchange">
                  <option value="NSE">NSE</option>
                  <option value="MCX">MCX</option>
                  <option value="NFO">NFO</option>
                  <option value="BSE">BSE</option>
                  <option value="CDS">CDS</option>
                </select>
              </label>
              <label>Symbol<input id="o-symbol" required autocomplete="off" /></label>
            </div>
            <div class="row2">
              <label>Qty<input id="o-qty" type="number" min="1" value="1" required /></label>
              <label
                >Product
                <select id="o-product">
                  <option value="INTRADAY">INTRADAY</option>
                  <option value="DELIVERY">DELIVERY</option>
                  <option value="CARRYFORWARD">CARRYFORWARD</option>
                  <option value="MARGIN">MARGIN</option>
                </select>
              </label>
            </div>
            <div class="row2">
              <label
                >Type
                <select id="o-type">
                  <option value="MARKET">MARKET</option>
                  <option value="LIMIT">LIMIT</option>
                  <option value="STOPLOSS_LIMIT">SL</option>
                  <option value="STOPLOSS_MARKET">SL-M</option>
                </select>
              </label>
              <label>Price<input id="o-price" type="number" step="0.05" value="0" /></label>
            </div>
            <label class="hidden" id="trigger-wrap"
              >Trigger price<input id="o-trigger" type="number" step="0.05" value="0"
            /></label>
            <div class="ltp-hint" id="o-ltp">—</div>
            <div class="lot-hint" id="o-lot"></div>
            <div class="row2">
              <button type="button" id="btn-buy" class="buy">BUY</button>
              <button type="button" id="btn-sell" class="sell">SELL</button>
            </div>
            <p class="note">Every order asks for confirmation before it is sent.</p>
          </form>
        </div>

        <div class="tab-body hidden" id="tab-positions"><div class="empty">No positions.</div></div>
        <div class="tab-body hidden" id="tab-holdings"><div class="empty">No holdings.</div></div>
        <div class="tab-body hidden" id="tab-orders"><div class="empty">No orders today.</div></div>
      </aside>
    </main>

    <!-- ---------------- bot ---------------- -->
    <footer class="panel bot">
      <div class="bot-config">
        <div class="panel-head">
          <h2>Strategy bot</h2>
          <div class="bot-actions">
            <span id="bot-state" class="badge idle">idle</span>
            <button id="bot-start" class="primary sm">Start bot</button>
            <button id="bot-stop" class="ghost sm" disabled>Stop</button>
          </div>
        </div>
        <div class="bot-grid">
          <label
            >Strategy
            <select id="b-strategy"></select>
          </label>
          <label
            >Exchange
            <select id="b-exchange">
              <option value="NSE">NSE</option>
              <option value="MCX">MCX</option>
              <option value="NFO">NFO</option>
              <option value="BSE">BSE</option>
            </select>
          </label>
          <label>Symbol<input id="b-symbol" value="NIFTY" autocomplete="off" /></label>
          <label
            >Interval
            <select id="b-interval">
              <option value="ONE_MINUTE">1m</option>
              <option value="THREE_MINUTE">3m</option>
              <option value="FIVE_MINUTE" selected>5m</option>
              <option value="FIFTEEN_MINUTE">15m</option>
            </select>
          </label>
          <label>Qty<input id="b-qty" type="number" min="1" value="1" /></label>
          <label
            >Mode
            <select id="b-mode">
              <option value="PAPER" selected>PAPER (simulated)</option>
              <option value="LIVE">LIVE (real money)</option>
            </select>
          </label>
          <label>Poll (s)<input id="b-poll" type="number" min="10" value="30" /></label>
          <label>Max trades<input id="b-maxtrades" type="number" min="1" value="6" /></label>
          <label>Max loss (₹)<input id="b-maxloss" type="number" min="0" value="2000" /></label>
          <label>Square off<input id="b-squareoff" value="15:15" /></label>
          <label class="check"
            ><input id="b-short" type="checkbox" /><span>Allow short</span></label
          >
        </div>
        <p class="strategy-desc muted" id="b-desc"></p>
        <div class="bot-stats" id="bot-stats"></div>
      </div>
      <div class="bot-log">
        <div class="panel-head">
          <h2>Log</h2>
          <button id="log-clear" class="ghost sm">Clear</button>
        </div>
        <div id="log" class="log"></div>
      </div>
    </footer>

    <script src="vendor/lightweight-charts.js"></script>
    <script src="drawings.js"></script>
    <script src="chart.js"></script>
    <script src="app.js"></script>
  </body>
</html>
